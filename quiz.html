<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        #question {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .option {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
        }

        .option:hover {
            background: #f0f0f0;
        }

        .option.selected {
            background: #dbeafe;
            border-color: #0077b6;
        }

        #nextBtn,
        #restartBtn {
            display: block;
            margin: 25px auto 0;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #0077b6;
            color: white;
            cursor: pointer;
        }

        #result {
            text-align: center;
            font-size: 22px;
            margin-top: 20px;
        }

        .progress {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <h1>Web Development Quiz</h1>

    <div id="quiz">

        <div class="progress" id="progress"></div>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button id="nextBtn">Next</button>

    </div>

    <div id="result"></div>

    <button id="restartBtn" style="display:none;">
        Restart Quiz
    </button>

</div>
